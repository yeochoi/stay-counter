<!-- @dsCard height=300 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap">
<style>
.cv{position:relative;width:960px;height:300px;background:var(--bg);overflow:hidden;font-family:var(--font-sans)}
.cv svg{position:absolute;left:480px;top:0}
.txt{position:absolute;left:40px;bottom:34px;max-width:440px}
.nm{font-size:96px;line-height:.95;font-weight:600;letter-spacing:-0.03em;color:var(--ink);margin:0}
.tg{font-size:15px;line-height:20px;color:var(--muted);margin:14px 0 0}
</style>
<div class="cv">
<svg width="480" height="300" viewBox="0 0 480 300" aria-hidden="true">
<!--
blocks: hero 260x320 slab bleeding off the top, soft pill 168x84, current pill 120x44, coral disc r 30
arrangement: one tall slab with satellites, like the dark hero over light cards
pattern row: literal motif, the countdown ring on the slab, because the app answers with a ring that empties day by day
steps and radii: gutter 22 for ring stroke spacing, radius-card 16 on the slab, radius-pill on pills and disc
-->
<rect x="22" y="-20" width="260" height="320" rx="16" fill="var(--hero)"/>
<circle cx="152" cy="150" r="80" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="16"/>
<circle cx="152" cy="150" r="80" fill="none" stroke="var(--ring)" stroke-width="16" stroke-linecap="round" stroke-dasharray="335 503" transform="rotate(-90 152 150)"/>
<rect x="304" y="34" width="168" height="84" rx="42" fill="var(--soft)"/>
<rect x="304" y="140" width="120" height="44" rx="22" fill="var(--current-line)"/>
<circle cx="350" cy="236" r="30" fill="var(--coral)"/>
<rect x="398" y="214" width="74" height="44" rx="22" fill="var(--primary)"/>
</svg>
<div class="txt"><p class="nm">Stay<br>Counter</p><p class="tg">Know your days, wherever you are.</p></div>
</div>
<script></script>
